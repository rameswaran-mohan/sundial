name: registry
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: registry
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: git pull --ff-only
      - name: Seed from the committed registry
        run: |
          if [ -f registry/lifecycle.json ]; then uv run sundial import registry/lifecycle.json --db /tmp/registry.db; fi
      - name: Scan every source
        id: scan
        continue-on-error: true
        run: uv run sundial scan --strict --db /tmp/registry.db
      - name: Export
        run: uv run sundial export --out registry/lifecycle.json --db /tmp/registry.db
      - name: Commit when changed
        run: |
          git add registry/lifecycle.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(registry): nightly lifecycle update"
            git push
          fi
      - name: Fail if any source failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
