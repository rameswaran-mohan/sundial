[project]
name = "sundial-llm"
version = "0.1.0"
description = "Model lifecycle guard for LLM gateways: tracks provider deprecations and new models, then warns, blocks or redirects in-process."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Rameshwaran Mohan" }]
keywords = ["llm", "gateway", "litellm", "deprecation", "model lifecycle", "asgi", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
litellm = ["litellm>=1.60"]

[project.scripts]
sundial = "sundial_llm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sundial_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
